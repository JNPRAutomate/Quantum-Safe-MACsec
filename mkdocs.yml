site_name: Quantum-Safe MACsec
site_description: QKD-assisted MACsec automation for Juniper devices
site_url: https://jnprautomate.github.io/Quantum-Safe-MACsec/
repo_url: https://github.com/JNPRAutomate/Quantum-Safe-MACsec
repo_name: JNPRAutomate/Quantum-Safe-MACsec

docs_dir: docs
site_dir: site

theme:
  name: material
  language: en
  favicon: images/quantum-safe-macsec.svg
  features:
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - toc:
      permalink: true

plugins:
  - search

exclude_docs: |
  __mdinclude.md

nav:
  - Welcome: index.md
  - Start here:
      - First steps: getting_started.md
      - Documentation map: readme.md
      - Architecture evolution: architecture_evolution.md
      - Roadmap: roadmap.md
  - Domain guides:
      - Overview: toc.md
  - Understand the system:
      - Theory and standards:
          - Guide overview: pqc/toc.md
          - Overview: pqc/theory_and_standards.md
          - MKA, QKD, KME, and SAE: pqc/mka_qkd_kme.md
          - ETSI GS QKD 014: pqc/etsi_gs_qkd_014.md
          - PKI and mTLS: pqc/pki_mtls.md
          - Glossary: pqc/glossary.md
      - KME orchestrator:
          - Guide overview: kme/toc.md
          - Architecture: kme/architecture.md
          - Configuration and lifecycle: kme/configuration_and_lifecycle.md
          - Security and certificates: kme/security_and_certificates.md
          - First-run guide: kme/first_run_guide.md
          - CLI reference: kme/cli_reference.md
          - Operations and troubleshooting: kme/operations_and_troubleshooting.md
          - Vault integration: kme/vault_localhost_8200_setup.md
          - Design evolution: kme/design_evolution.md
          - Lab and migration history:
