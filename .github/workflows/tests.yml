name: Offline test suite

on:
  push:
    branches:
      - ver3.3.4.2
    paths:
      - "artifacts/**"
      - "config/**"
      - "kme_orchestrator.py"
      - "lib/**"
      - "qkd_orchestrator.py"
      - "tests/**"
      - "tools/**"
      - "pyproject.toml"
      - "requirements.txt"
      - ".github/workflows/tests.yml"
  pull_request:
    branches:
      - ver3.3.4.2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and test dependencies
        run: python -m pip install -e ".[test]"

      - name: Run offline test suite
        run: python -m pytest -q
