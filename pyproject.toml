[project]
name = "quantum-safe-macsec"
version = "3.3.4"
description = "QKD-assisted MACsec orchestration and tooling for Juniper devices."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "junos-eznc",
  "paramiko",
  "scp",
  "lxml",
  "jinja2",
  "pyopenssl",
  "cryptography",
  "requests",
  "urllib3",
  "pyyaml",
]

[project.optional-dependencies]
test = [
  "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra"]
