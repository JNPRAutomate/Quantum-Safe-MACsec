deployment:
  backend: onbox

ssh:
  local: true

paths:
  project_dir: /root/etsi_kme_docker_etsi14_kme

docker:
  compose_file: config/kme/onbox-postgres-compose.yaml
  image: etsi-kme:local

database:
  # Existing shared PostgreSQL service; never started on the routers.
  host: 10.38.98.181
  port: 5432
  db_name: key_store
  # Local, untracked file with POSTGRES_USER and POSTGRES_PASSWORD.
  credentials_file: /root/etsi14-kme-lab/postgres.env
  service_name: qkd-postgres
  container_name: etsi14-postgres
  username: db_user
  volume_name: etsi14-postgres-data

kme:
  worker_threads: 2
