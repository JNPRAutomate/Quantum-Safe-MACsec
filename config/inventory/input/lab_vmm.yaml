# Lab VMM inventory, verified 2026-09-30.
#
# Router models and Junos releases observed with "show version":
#   EVO1:    ptx10001-36mr, 26.2R1.7-EVOI20260619095247-evo-builder-1
#   EVO2:    ptx10002-36qdd, 26.2R1.7-EVOI20260619095247-evo-builder-1
#   MX9601/2/3 and MX4803/4: Junos 26.2R1.5
#
# KME container network on ubuntu204:
#   qkd_net, ipvlan L2, parent eth0, subnet 10.38.96.0/19,
#   gateway 10.38.127.254. PostgreSQL is at 10.38.100.30 and is
#   intentionally not configured as a QKD API endpoint here.
#
# MACsec CA and key-chain names are the ones configured on the routers
# (verified 2026-09-30). On-box names use the short aliases MX1=MX9601,
# MX2=MX9602, MX3=MX9603, MX4=MX4803, MX5=MX4804.
#
# Credentials are deliberately omitted. Supply them through the supported
# runtime prompt/environment mechanism; do not commit lab passwords.
topology: links
platform: mixed
mode: qkd
pki_profile: hierarchical_ca

devices:
  - name: EVO1
    hostname: evo1
    platform: ptx
    ip: 10.38.97.218
    qkd:
      sae_id: sae-001
    kme:
      ip: 10.38.100.10
      port: 8443
    interfaces:
      - et-0/0/1
      - et-0/0/2

  - name: EVO2
    hostname: evo2
    platform: ptx
    ip: 10.38.97.228
    qkd:
