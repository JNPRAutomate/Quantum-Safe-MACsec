qkd_policy:
  # Minimal profile: deterministic master/slave synchronization.
  rekey_enabled: true
  batch_enabled: true
  strict_sync_enabled: true
  pending_auto_evict_enabled: true
  peer_transport_mode: queue
  interval_seconds: 60

  # Keep batch size aligned with installed window for deterministic rotation.
  # Increase to 5 only if max_installed_keys is also increased to 5.
  key_batch_size: 4
  max_installed_keys: 4

  # Single pending-control window family.
  pending_confirm_grace_seconds: 60
  pending_stuck_recovery_seconds: 180

  # Queue transport safety controls
  peer_enqueue_min_margin_seconds: 30
  peer_batch_ack_timeout_seconds: 60

  # Peer SSH key rotation (etsi_peer_view user ED25519 keypair)
  # Rotate every N seconds. Set to 0 to disable rotation.
  # Private key stays on-device, public key synced peer-to-peer.
  peer_key_rotation_interval_seconds: 600