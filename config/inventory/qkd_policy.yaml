qkd_policy:
  # Minimal profile: deterministic master/slave synchronization.
  rekey_enabled: true
  batch_enabled: true
  # Keep a deterministic MACsec fallback CKN/CAK on every connectivity
  # association while QKD keychains are bootstrapped and rotated.
  bootstrap_with_fallback_key: true
  bootstrap_fallback_keys: 1
  strict_sync_enabled: true
  # Never advance the keyring by deleting pending software state without
  # bilateral MKA confirmation of the active key.
  pending_auto_evict_enabled: false
  peer_transport_mode: queue
  # Junos event-options cadence. Keep this shorter than the protected
  # active/pending horizon so a delayed invocation cannot exhaust the ring.
  execution_interval_seconds: 60
  # Distance between consecutive Junos key start-times. This is independent
  # from the script execution cadence, but it is also the entire budget
  # available to complete one bilateral rolling-replacement transaction
  # (KME fetch + local commit + SSH push + peer commit + ACK wait) before the
  # ring's "next" slot elapses. It must comfortably exceed
  # peer_batch_ack_timeout_seconds (150s) and leave room for multiple
  # execution_interval_seconds (60s) retries; 120s left ~0-1 retry budget,
  # so a single transient failure (KME/SSH/commit-lock/ACK timeout, or one
  # missed cron tick) could exhaust every configured slot before a
  # replacement completed. 300s leaves a 150s margin over the ACK timeout
  # and up to ~5 retries per window. (A RING_REARM self-heal in
  # select_ring_update_slots() now also recovers automatically if the ring
  # is ever exhausted despite this margin -- see hitless_rolling_keyring
  # docs -- but this value should still be sized to make that rare.)
  key_activation_interval_seconds: 300

  # The on-box runtime uses this as the initial ring window: slot 0 is the
  # orchestrator seed, slots 1..3 are fetched from the KME after MACsec is up.
  # Steady-state replacement protects active/pending and updates N-2 slots.
  key_batch_size: 4
  max_installed_keys: 4

  # Adaptive activation grace uses only successful ACK-completed transactions.
  # grace = ceil(max(floor, max(last N delta_total)) + safety, rounding)
  adaptive_grace_history_size: 32
  adaptive_grace_floor_seconds: 150
  adaptive_grace_safety_margin_seconds: 30
  adaptive_grace_rounding_seconds: 60

  # Queue transport safety controls
  # Defense-in-depth minimum checked immediately before queue delivery.
  peer_enqueue_min_margin_seconds: 60
  # One complete 60-second peer tick plus 90 seconds for lock, commit,
  # transport, and polling overhead.
  peer_batch_ack_timeout_seconds: 150
  peer_batch_ack_poll_interval_seconds: 5

  # Independent etsi_peer_view ED25519 transport-key rotation. qkd_onbox runs
  # this only after MACsec keyring work, never during a keyring transaction.
  peer_key_rotation_interval_seconds: 600