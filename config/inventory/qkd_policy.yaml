qkd_policy:
  # Minimal profile: deterministic master/slave synchronization.
  rekey_enabled: true
  batch_enabled: true
  # Keep a deterministic MACsec fallback CKN/CAK on every connectivity
  # association while QKD keychains are bootstrapped and rotated.
  bootstrap_with_fallback_key: true
  bootstrap_fallback_keys: 1
  strict_sync_enabled: true
  pending_auto_evict_enabled: true
  peer_transport_mode: queue
  # MACsec keychain key rotation cadence AND the Junos event-options QKD_TIMER
  # tick interval that invokes qkd_onbox.py (see event.j2) - both driven by
  # this single value. 120s = key rotation every 2 minutes.
  interval_seconds: 120

  # Keep batch size aligned with installed window for deterministic rotation.
  # Increase to 5 only if max_installed_keys is also increased to 5.
  key_batch_size: 4
  max_installed_keys: 4

  # Single pending-control window family. Both default to formulas derived
  # from interval_seconds/key_batch_size (pending_confirm_grace_seconds()/
  # pending_stuck_recovery_seconds() in qkd_onbox.py); pinned explicitly here
  # to keep them in lockstep with interval_seconds=120 above.
  pending_confirm_grace_seconds: 120
  pending_stuck_recovery_seconds: 600

  # Queue transport safety controls
  # Minimum lead time before a batch's first key activation - scales with
  # interval_seconds (default formula: max(15, interval_seconds // 2)).
  peer_enqueue_min_margin_seconds: 60
  # The peer only drains its inbound-batch queue once per its own periodic
  # script tick (interval_seconds above, driven by Junos event-options
  # QKD_TIMER), not immediately upon SCP receipt of the batch file. A batch
  # landing just after a tick has already fired must wait almost one full
  # extra interval_seconds before the peer's next tick processes it and
  # writes the ACK. Sized as one full tick plus a fixed buffer that covers
  # install/lock/SCP/poll overhead (see peer_batch_ack_timeout_seconds() in
  # qkd_onbox.py).
  peer_batch_ack_timeout_seconds: 210
  # Poll more frequently to match the shorter timeout window.
  peer_batch_ack_poll_interval_seconds: 5
  # Schedule running-batch key0 after the complete peer ACK window. The script
  # enforces a minimum of peer_batch_ack_timeout_seconds + 30 seconds.
  batch_activation_margin_seconds: 480

  # Peer SSH key rotation (etsi_peer_view user ED25519 keypair)
  # Rotate every N seconds. Set to 0 to disable rotation.
  # Private key stays on-device, public key synced peer-to-peer.
  peer_key_rotation_interval_seconds: 300