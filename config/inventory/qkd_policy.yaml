qkd_policy:
  # 60s lab profile: strict synchronization and queue+ACK transport
  rekey_enabled: true
  batch_enabled: true
  strict_sync_enabled: true
  pending_auto_evict_enabled: true
  peer_transport_mode: queue

  bootstrap_with_fallback_key: true
  bootstrap_fallback_keys: 1
  interval_seconds: 60

  # Keep batch size aligned with installed window for deterministic rotation.
  # Increase to 5 only if max_installed_keys is also increased to 5.
  key_batch_size: 4
  max_installed_keys: 4

  pending_confirm_grace_seconds: 20
  pending_stuck_recovery_seconds: 120
  pending_recovery_window_seconds: 90
  pending_stuck_aggressive_clear_seconds: 180
  pending_stuck_strict_block_clear_seconds: 120
  pending_stuck_force_clear_seconds: 240

  # Queue transport safety controls
  peer_enqueue_min_margin_seconds: 30
  peer_batch_ack_timeout_seconds: 60

  key_ttl_seconds: 0

  purge_on_kme_loss: false
  purge_after_seconds: 0